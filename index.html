<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020202" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Arsenal Atlas — Explore the World's Military Arsenal</title>
    <meta
      name="description"
      content="A premium encyclopedia of the world's military equipment. Specifications, history, variants, and imagery for firearms, armour, aircraft, and naval vessels."
    />
    <link rel="canonical" href="https://arsenalatlas.firebaseapp.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arsenal Atlas" />
    <meta property="og:title" content="Arsenal Atlas — Explore the World's Military Arsenal" />
    <meta
      property="og:description"
      content="A premium encyclopedia of the world's military equipment."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Wikimedia serves every equipment image; warm the connection early
         so the hero LCP isn't waiting on DNS + TLS. -->
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link rel="dns-prefetch" href="https://upload.wikimedia.org" />

    <!--
      Applies the stored theme before first paint. This has to be a blocking
      inline script: doing it in React would render one frame of the default
      theme first, which reads as a flash on every single page load.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aa.theme') || 'dark';
          var resolved =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : stored;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[999] focus:rounded-lg focus:bg-elevated focus:px-4 focus:py-2 focus:text-fg"
    >
      Skip to main content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
